# ==============================================================================
# DESLA SUPABASE CONFIGURATION
# ==============================================================================
project_id = "desla-official"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[edge_runtime]
enabled = true
port = 54324

[functions.process-emails]
verify_jwt = false
