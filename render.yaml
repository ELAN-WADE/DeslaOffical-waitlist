services:
  - type: web
    name: desla-waitlist
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Desla Official <elanwadebrook@gmail.com>"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: data
